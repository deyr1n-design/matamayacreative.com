<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 70" fill="#EBAD58" aria-label="Mata Maya symbol">
  <!-- Built on the 7x7 module grid from the Mata Maya brand guideline (1 module = 10 units). -->
  <!-- Q1: U shape -->
  <path d="M0 0H10V20H20V0H30V30H0Z"/>
  <!-- Q2: two bars -->
  <rect x="40" y="0" width="30" height="10"/>
  <rect x="40" y="20" width="30" height="10"/>
  <!-- Q3: bar + two squares -->
  <rect x="0" y="40" width="30" height="10"/>
  <rect x="0" y="60" width="10" height="10"/>
  <rect x="20" y="60" width="10" height="10"/>
  <!-- Q4: three 45-degree triangles -->
  <path d="M47.07 40H70L58.54 51.46Z"/>
  <path d="M40 47.07V70L51.46 58.54Z"/>
  <path d="M70 54.14V70H54.14Z"/>
</svg>
